<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Writella - Industrial Research Studio</title>
    <meta name="description" content="An AI-powered, forensic writing and auditing app designed to analyze text for grammar, syntax, flow, and academic rigor." />
    <meta property="og:title" content="Writella" />
    <meta property="og:description" content="An AI-powered, forensic writing and auditing app designed to analyze text for grammar, syntax, flow, and academic rigor." />
    <meta property="og:type" content="website" />
    <script>
      // INDUSTRIAL THEME GUARD: Prevents the "white flash" by applying theme before CSS/React
      (function() {
        const savedTheme = localStorage.getItem('study-theme');
        if (savedTheme) {
          document.documentElement.setAttribute('data-theme', savedTheme);
        } else {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
